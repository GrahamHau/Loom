<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOM 设置</title>
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="brand">
        <img class="mark mark-image" src="../icons/icon48.png" alt="LOOM extension logo">
        <div>
          <h1>LOOM Clipper</h1>
          <p>配置采集插件的服务器、登录状态、平台和字段映射。</p>
        </div>
      </div>
      <button id="open-web" class="btn">打开 Web 端</button>
    </header>

    <section class="section">
      <div class="section-head">
        <h2>连接</h2>
        <span id="connection-state">未检测</span>
      </div>
      <div class="form-grid">
        <label>服务器地址<input id="api-base" type="url" placeholder="https://loom.my1panelsite.xyz"></label>
        <label>登录方式<input value="跟随 Web 端登录态自动同步" type="text" readonly></label>
      </div>
      <div class="section-note">插件不再单独保存账号密码。请先在 Web 端登录，插件会自动同步当前账号。</div>
      <div class="actions">
        <button id="open-web-login" class="btn primary">现在登录</button>
        <button id="test-connection" class="btn">刷新状态</button>
        <button id="logout" class="btn danger">退出登录</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>采集策略</h2>
      </div>
      <div class="form-grid">
        <label>默认模式
          <select id="default-mode">
            <option value="auto">自动判断</option>
            <option value="product">竞品</option>
            <option value="demand">需求</option>
          </select>
        </label>
        <label>AI 整理
          <select id="ai-before-save">
            <option value="true">默认开启，采集后自动整理</option>
            <option value="false">默认关闭，仅采集原始字段</option>
          </select>
        </label>
      </div>
      <div class="check-row">
        <label><input type="checkbox" data-platform="amazon"> Amazon</label>
        <label><input type="checkbox" data-platform="taobao"> 淘宝/天猫</label>
        <label><input type="checkbox" data-platform="xiaohongshu"> 小红书</label>
        <label><input type="checkbox" data-platform="kickstarter"> Kickstarter</label>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <h2>AI 模型配置</h2>
          <div class="section-sub">与 Web 工作台共用同一套 LLM 设置，保存后两边自动同步。</div>
        </div>
        <span id="llm-state">未检测</span>
      </div>
      <div class="form-grid">
        <label>API 类型
          <select id="llm-api-type">
            <option value="openai">OpenAI 兼容</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </label>
        <label>模型名称<input id="llm-model" type="text" placeholder="gpt-4.1-mini"></label>
        <label class="span-2">API URL<input id="llm-api-url" type="url" placeholder="https://api.openai.com/v1"></label>
        <label class="span-2">API Key<input id="llm-api-key" type="password" placeholder="sk-..."></label>
      </div>
      <div class="section-note">这里保存的是 Web 端后端配置，不是浏览器本地私有配置。</div>
      <div class="actions">
        <button id="refresh-llm" class="btn">刷新配置</button>
        <button id="test-llm" class="btn">测试连接</button>
        <button id="save-llm" class="btn primary">保存 AI 配置</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>字段映射</h2>
      </div>
      <div class="form-grid">
        <label>商品名称字段<input id="map-product-name" type="text"></label>
        <label>品牌字段<input id="map-product-brand" type="text"></label>
        <label>品类字段<input id="map-product-category" type="text"></label>
        <label>需求标题字段<input id="map-demand-title" type="text"></label>
        <label>需求摘要字段<input id="map-demand-summary" type="text"></label>
      </div>
      <div class="actions">
        <button id="save-settings" class="btn primary">保存设置</button>
        <button id="reset-settings" class="btn">恢复默认</button>
      </div>
    </section>

    <section class="section note">
      插件默认先做快速采集。用户可以直接保存到 Web 版，也可以手动点击 AI 整理后再保存。
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
