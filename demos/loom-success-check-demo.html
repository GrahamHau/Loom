<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loom Success Check Demo</title>
    <style>
      :root {
        --bg: #f4f7f6;
        --surface: rgba(255, 255, 255, 0.94);
        --text: #1f2937;
        --muted: #6b7280;
        --success: oklch(0.62 0.13 155);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(44, 182, 125, 0.12), transparent 34%),
          linear-gradient(180deg, #fbfffd 0%, var(--bg) 100%);
        font-family: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--text);
      }

      .panel {
        width: min(92vw, 420px);
        padding: 36px 28px 28px;
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 20px 48px rgba(15, 23, 42, 0.1);
        text-align: center;
      }

      .cl-success-hero {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 4px 0 14px;
      }

      .success-motion-icon {
        position: relative;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        transform-origin: 50% 50%;
        animation: success-settle .74s cubic-bezier(.2,.9,.22,1.06) both;
      }

      .success-motion-icon svg {
        overflow: visible;
      }

      .success-motion-ring {
        fill: var(--success);
        stroke: color-mix(in oklab, var(--success) 78%, white 22%);
        stroke-width: 2;
        transform-origin: 32px 32px;
        animation: success-pop 0.54s cubic-bezier(.2,.9,.22,1.12) both;
      }

      .success-motion-check {
        stroke: #fff;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: success-check 0.42s 0.16s cubic-bezier(.22,.8,.24,1) forwards;
      }

      .success-motion-icon::after {
        content: "";
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 999px;
        background: radial-gradient(circle, color-mix(in oklab, var(--success) 14%, white 86%) 0%, transparent 68%);
        opacity: 0;
        transform: scale(.72);
        animation: success-glow .7s .02s ease-out forwards;
        pointer-events: none;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      @keyframes success-pop {
        0% { opacity: 0; transform: scale(.7); }
        62% { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes success-settle {
        0% { transform: scale(.92); }
        54% { transform: scale(1.03); }
        73% { transform: scale(.985); }
        100% { transform: scale(1); }
      }

      @keyframes success-check {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes success-glow {
        0% { opacity: 0; transform: scale(.72); }
        35% { opacity: 1; }
        100% { opacity: 0; transform: scale(1.15); }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="cl-success-hero" aria-hidden="true">
        <div class="success-motion-icon">
          <svg viewBox="0 0 64 64" width="88" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="success-motion-ring" cx="32" cy="32" r="24" pathLength="100"></circle>
            <path class="success-motion-check" d="M21 32.5L28.4 39.6L43 25.8" pathLength="100"></path>
          </svg>
        </div>
      </div>
      <h1>Capture Saved</h1>
      <p>A green success motion icon for the browser plugin capture completion state.</p>
    </main>
  </body>
</html>
