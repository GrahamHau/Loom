<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Browser Swirl Demo</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: rgba(255, 255, 255, 0.92);
        --text: #1f2937;
        --muted: #6b7280;
        --blue: #0a67d8;
        --blue-soft: #68a5f0;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(10, 103, 216, 0.09), transparent 34%),
          linear-gradient(180deg, #fbfcfe 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .panel {
        width: min(92vw, 540px);
        padding: 36px 28px 30px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
        text-align: center;
        backdrop-filter: blur(14px);
      }

      .swirl-wrap {
        width: 180px;
        height: 180px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
      }

      .swirl {
        width: 128px;
        height: 128px;
        animation: spin 1.15s linear infinite;
        transform-origin: 50% 50%;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: #94a3b8;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

      <h1>Browser Loading Swirl</h1>
      <p>This is a hand-drawn HTML version of the Codex-style internal browser loading icon.</p>
