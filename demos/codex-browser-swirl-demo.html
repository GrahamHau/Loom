<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Browser Swirl Demo</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: rgba(255, 255, 255, 0.92);
        --text: #1f2937;
        --muted: #6b7280;
        --blue: #0a67d8;
        --blue-soft: #68a5f0;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(10, 103, 216, 0.09), transparent 34%),
          linear-gradient(180deg, #fbfcfe 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .panel {
        width: min(92vw, 540px);
        padding: 36px 28px 30px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
        text-align: center;
        backdrop-filter: blur(14px);
      }

      .swirl-wrap {
        width: 180px;
        height: 180px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
      }

      .swirl {
        width: 128px;
        height: 128px;
        animation: spin 1.15s linear infinite;
        transform-origin: 50% 50%;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: #94a3b8;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="swirl-wrap" aria-hidden="true">
        <svg class="swirl" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="swirlStroke" x1="18" y1="10" x2="112" y2="120" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#68A5F0" />
              <stop offset="0.45" stop-color="#0A67D8" />
              <stop offset="1" stop-color="#0A67D8" />
            </linearGradient>
          </defs>
          <path
            d="M64 14C41.1 14 22.5 32.6 22.5 55.5C22.5 73.6 37.2 88.3 55.3 88.3C69.5 88.3 81.1 76.7 81.1 62.5C81.1 51.6 72.3 42.8 61.4 42.8C53.3 42.8 46.8 49.3 46.8 57.4C46.8 63.1 51.4 67.7 57.1 67.7C60.6 67.7 63.5 64.8 63.5 61.3"
            stroke="url(#swirlStroke)"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M64 14C86.9 14 105.5 32.6 105.5 55.5C105.5 78.4 86.9 97 64 97C41.1 97 22.5 78.4 22.5 55.5"
            stroke="url(#swirlStroke)"
            stroke-width="10"
            stroke-linecap="round"
            opacity="0.14"
          />
        </svg>
      </div>
      <h1>Browser Loading Swirl</h1>
      <p>This is a hand-drawn HTML version of the Codex-style internal browser loading icon.</p>
      <div class="hint">We can keep tuning the curve, thickness, or blue tone until it matches.</div>
    </main>
  </body>
</html>
